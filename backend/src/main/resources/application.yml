server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trello}
    username: ${SPRING_DATASOURCE_USERNAME:trello}
    password: ${SPRING_DATASOURCE_PASSWORD:trello123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: mySuperSecretKeyForJwtSigningThatIsLongEnough1234567890
  expiration: 86400000  # 24 hours